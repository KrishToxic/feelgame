<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeelCheck.in - Love Quiz</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins&display=swap">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('https://i.ibb.co/9NfNhLy/love-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      width: 100%; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
    .anime-girl {
      position: absolute;
      bottom: 0; right: 20px;
      width: 250px;
      animation: float 3s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
    .start-screen {
      display: block;
    }
    .quiz-screen {
      display: none;
    }
    .btn {
      background: #ff6584;
      border: none;
      padding: 10px 20px;
      color: white;
      font-size: 18px;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #ff456a;
    }
    .question {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .options button {
      background: white;
      color: black;
      padding: 10px;
      margin: 5px;
      border-radius: 15px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .options button:hover {
      transform: scale(1.05);
    }
    audio {
      display: none;
    }
  </style>
</head>
<body>
  <audio autoplay loop>
    <source src="https://files.catbox.moe/x7bkiq.mp3" type="audio/mp3">
  </audio>  <div class="overlay"></div>
  <div class="container">
    <div class="start-screen" id="startScreen">
      <h1>Welcome to FeelCheck.in</h1>
      <p>Check how deep your love emotions are</p>
      <button class="btn" onclick="startGame()">Start Game</button>
    </div><div class="quiz-screen" id="quizScreen">
  <div class="question" id="question">Loading...</div>
  <div class="options" id="options"></div>
</div>

  </div>  <img src="https://i.ibb.co/BVvK2s6/anime-girl.png" class="anime-girl" id="animeGirl" />  <script>
    const questions = [
      { text: "Tum usse bina bat ki yaad karte ho?", type: "love" },
      { text: "Kabhi uske liye apne emotions chupaye ho?", type: "sad" },
      { text: "Uske bina bhi khush rehna seekh gaye ho?", type: "sad" },
      { text: "Aaj bhi uski khushi tumhari khushi hai?", type: "love" },
      { text: "Kabhi uske fake smile ko feel kiya tha?", type: "sad" },
      { text: "Uska naam sunke chehra chamak utha tha?", type: "love" },
      { text: "Usne ignore kiya phir bhi tum loyal rahe?", type: "sad" },
      { text: "Dil se kabhi dua di uske liye?", type: "love" },
      { text: "Waqt ke saath sab bhula diya?", type: "sad" },
      { text: "Phir bhi usi ko dil diya hai?", type: "love" },
    ];

    let currentQuestion = 0;
    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const girlEl = document.getElementById("animeGirl");

    function startGame() {
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("quizScreen").style.display = "block";
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      questionEl.textContent = q.text;
      optionsEl.innerHTML = `
        <button onclick="answer('yes')">Haan</button>
        <button onclick="answer('no')">Nahi</button>
      `;
    }

    function answer(choice) {
      const q = questions[currentQuestion];
      if (q.type === "sad" && choice === "yes") {
        girlEl.src = "https://i.ibb.co/jRvVLbX/anime-girl-sad.png";
      } else if (q.type === "love" && choice === "yes") {
        girlEl.src = "https://i.ibb.co/BVvK2s6/anime-girl.png";
      } else {
        girlEl.src = "https://i.ibb.co/Zh3M7C5/anime-girl-neutral.png";
      }

      setTimeout(() => {
        currentQuestion++;
        if (currentQuestion < questions.length) {
          showQuestion();
        } else {
          questionEl.textContent = "Thank you for playing. Your FeelCheck is complete.";
          optionsEl.innerHTML = "";
        }
      }, 1500);
    }
  </script></body>
</html>
